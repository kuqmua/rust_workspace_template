[package]
name = "server_table_example"
version = "0.1.0"
publish = false
description = "Rust microservice workspace component"
repository = "https://github.com/kuqmua/rust_workspace_template"

license = "MIT"
edition = "2024"

[dependencies]
str_constants = { workspace = true }
app_state = { workspace = true }
