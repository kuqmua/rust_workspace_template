reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true }
utoipa = { workspace = true }
tracing = { workspace = true }
where_filters = { workspace = true }
git_info = { workspace = true }
generate_pg_table = { workspace = true }
futures = { workspace = true }
frontend_contract = { workspace = true }
location_lib = { workspace = true }
location_macros = { workspace = true }
metrics = { workspace = true }
location = { workspace = true }
pg_table = { workspace = true, features = ["test-utils"] }
pg_crud_common = { workspace = true, features = ["test-utils"] }
pg_types_numeric = { workspace = true, features = ["test-utils"] }
pg_types_text_misc = { workspace = true, features = ["test-utils"] }
route_validators = { workspace = true }
server_runtime = { workspace = true }
server_app_state = { workspace = true, features = ["test-utils"] }
