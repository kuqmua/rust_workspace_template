[package]
authors = ["sergey shmakov <tyfaproject@gmail.com>"]
edition = "2024"
name = "server_admin_frontend"
version = "0.1.0"
publish = false
description = "Reusable Rust administrative frontend"
repository = "https://github.com/kuqmua/rust_workspace_template"

license = "MIT"
keywords = ["admin", "frontend"]
categories = ["web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
newtype = { workspace = true }
server_admin_contract = { workspace = true }
str_constants = { workspace = true }
thiserror = { workspace = true }
to_err_string = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true }
leptos = { workspace = true, features = ["ssr"] }
tower-http = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { workspace = true, features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Element", "Headers", "HtmlDocument", "HtmlElement", "Location", "Request", "RequestInit", "Response", "UrlSearchParams", "Window"] }

[dev-dependencies]
frontend_contract = { workspace = true }

[lints]
workspace = true
