[package]
authors = ["sergey shmakov <tyfaproject@gmail.com>"]
edition.workspace = true
name = "frontend_admin"
version.workspace = true
publish.workspace = true
description.workspace = true
repository.workspace = true

license.workspace = true
keywords = ["admin", "frontend"]
categories = ["web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
proc_macro_new = { workspace = true }
proc_macro_newtype_from_inner = { workspace = true }
proc_macro_newtype_into_inner_from = { workspace = true }
proc_macro_getters = { workspace = true }
proc_macro_naming_enum_with_unit_fields_to_snake_case_str = { workspace = true }
proc_macro_naming_enum_with_unit_fields_to_upper_snake_case_str = { workspace = true }
bounded_types = { workspace = true }
constants_usize = { workspace = true }
constants_u32 = { workspace = true }
frontend_contract = { workspace = true }
proc_macro_optimal_memory_layout = { workspace = true }
proc_macro_newtype_as_ref_str = { workspace = true }
proc_macro_newtype_display = { workspace = true }
proc_macro_newtype_into_inner = { workspace = true }
proc_macro_newtype_bounded_string_wrapper = { workspace = true }
server_admin_contract = { workspace = true }
singlestage = { workspace = true }
constants_str = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true }
leptos = { workspace = true, features = ["ssr"] }
to_err_string = { workspace = true }
tower-http = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { workspace = true, features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
  "Document",
  "Element",
  "Headers",
  "HtmlDocument",
  "HtmlElement",
  "Location",
  "Request",
  "RequestInit",
  "Response",
  "UrlSearchParams",
  "Window",
] }

[dev-dependencies]
constants_i64 = { workspace = true }
constants_u64 = { workspace = true }

[lints]
workspace = true
