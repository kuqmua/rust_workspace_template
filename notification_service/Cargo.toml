[package]
name = "notification_service"
version = "0.1.0"
publish = false
description = "Independently deployable notification microservice reference implementation"
repository = "https://github.com/kuqmua/rust_workspace_template"

license = "MIT"
keywords = ["notification", "microservice"]
categories = ["web-programming"]
edition = "2024"

[[bin]]
name = "notification_service"
path = "src/main.rs"

[dependencies]
app_state = { workspace = true }
axum = { workspace = true }
config_lib = { workspace = true }
frontend_contract = { workspace = true }
http = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
newtype = { workspace = true }
notification_service_config = { workspace = true }
notification_service_contract = { workspace = true }
secrecy = { workspace = true }
server_runtime = { workspace = true }
sqlx = { workspace = true, features = ["macros"] }
str_constants = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
