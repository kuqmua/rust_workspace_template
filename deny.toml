[graph]
all-features = true
[output]
feature-depth = 1
[advisories]
ignore = [
  "RUSTSEC-2021-0141", # dotenv is unmaintained — consider migrating to dotenvy
  "RUSTSEC-2024-0370", # proc-macro-error is unmaintained — used transitively
]
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = []
[licenses.private]
ignore = true
registries = []
[[licenses.clarify]]
crate = "generate_pg_table_test_cnt"
expression = "MIT"
license-files = []
[[licenses.clarify]]
crate = "generate_pg_types_test_cnt"
expression = "MIT"
license-files = []
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = [
  { name = "foldhash", version = "0.1.5" },
  { name = "getrandom", version = "0.2.17" },
  { name = "getrandom", version = "0.3.4" },
  { name = "hashbrown", version = "0.14.5" },
  { name = "hashbrown", version = "0.15.5" },
  { name = "hashbrown", version = "0.16.1" },
  { name = "r-efi", version = "5.3.0" },
  { name = "rand", version = "0.8.6" },
  { name = "rand_chacha", version = "0.3.1" },
  { name = "rand_core", version = "0.6.4" },
  { name = "redox_syscall", version = "0.5.18" },
  { name = "syn", version = "1.0.109" },
  { name = "thiserror", version = "1.0.69" },
  { name = "thiserror-impl", version = "1.0.69" },
  { name = "windows-sys", version = "0.48.0" },
]
skip-tree = []
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
