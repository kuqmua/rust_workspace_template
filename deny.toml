[graph]
all-features = true
[output]
feature-depth = 1
[advisories]
ignore = [
  "RUSTSEC-2021-0141", # owner: maintainers; review by 2026-10-01; dotenv is unmaintained — migrate when dependency changes are authorized
  "RUSTSEC-2024-0436", # owner: frontend; review by 2026-10-01; paste is an unmaintained transitive Leptos dependency
  "RUSTSEC-2026-0173", # owner: frontend; review by 2026-09-01; proc-macro-error2 blocks a future Rust upgrade through Leptos
]
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "NCSA",
]
confidence-threshold = 0.8
exceptions = []
[licenses.private]
ignore = true
registries = []
[[licenses.clarify]]
crate = "generate_pg_table_test_cnt"
expression = "MIT"
license-files = []
[[licenses.clarify]]
crate = "generate_pg_types_test_cnt"
expression = "MIT"
license-files = []
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = [
  { name = "getrandom", version = "0.2.17" },
  { name = "getrandom", version = "0.3.4" },
  { name = "hashbrown", version = "0.16.1" },
  { name = "r-efi", version = "5.3.0" },
  { name = "rand_core", version = "0.6.4" },
  { name = "thiserror", version = "1.0.69" },
  { name = "thiserror-impl", version = "1.0.69" },
]
skip-tree = []
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
