services:
  database:
    image: ghcr.io/kuqmua/postgresql_16_with_pg_jsonschema@sha256:e95f0b8fce882a4cadbd7a1e01451a1440b356299af7a2a17859018914d0c178
    environment:
      POSTGRES_DB: rust_workspace_template
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rust_workspace_template"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - application
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  notification_database:
    image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    environment:
      POSTGRES_DB: notification_service
      POSTGRES_PASSWORD: "${NOTIFICATION_POSTGRES_PASSWORD:?set NOTIFICATION_POSTGRES_PASSWORD}"
      POSTGRES_USER: notification_service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_service -d notification_service"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - application
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
  server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - server/.env
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@database:5432/rust_workspace_template"
      SERVICE_SOCKET_ADDRESS: "0.0.0.0:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - application
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp:size=16m,mode=1777
  notification_service:
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    depends_on:
      notification_database:
        condition: service_healthy
    environment:
      NOTIFICATION_DATABASE_URL: "postgres://notification_service:${NOTIFICATION_POSTGRES_PASSWORD:?set NOTIFICATION_POSTGRES_PASSWORD}@notification_database:5432/notification_service"
      NOTIFICATION_SERVICE_SOCKET_ADDRESS: "0.0.0.0:8081"
      PG_POOL_MAX_CONNECTIONS: "10"
      REQUEST_TIMEOUT_SECONDS: "30"
      TRACING_FORMAT: text
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - application
    ports:
      - "127.0.0.1:8081:8081"
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp:size=16m,mode=1777
networks:
  application:
volumes:
  notification_postgres_data:
  postgres_data:
