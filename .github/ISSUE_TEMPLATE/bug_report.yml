name: Administrator bug report
description: Report a reproducible, non-sensitive administrator template defect.
title: "[admin bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, personal data, private keys, or undisclosed vulnerabilities. Use SECURITY.md for security reports.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and safe reproduction
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Deployment and browser details
    validations:
      required: true
