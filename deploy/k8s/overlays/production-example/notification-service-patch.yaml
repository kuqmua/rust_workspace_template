apiVersion: apps/v1
kind: "Deployment"
metadata:
  name: notification-service
  namespace: rust-workspace-template
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/environment: production
      annotations:
        rust-workspace-template/config-revision: replace-with-config-revision
    spec:
      containers:
        - name: notification-service
          image: registry.example.invalid/notification-service@sha256:replace-with-release-digest
          env:
            - name: NOTIFICATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: notification-service-secrets
                  key: notification-database-url
