apiVersion: apps/v1
kind: "Deployment"
metadata:
  name: application
  namespace: rust-workspace-template
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/environment: production
    spec:
      containers:
        - name: application
          image: registry.example.invalid/application@sha256:replace-with-release-digest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: database-url
            - name: ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: admin-jwt-secret
