apiVersion: apps/v1
kind: Deployment
# BEGIN GENERATED KUBERNETES METADATA notification-service
metadata:
  name: notification-service
  namespace: rust-workspace-template
# END GENERATED KUBERNETES METADATA notification-service
spec:
  replicas: 2
  # BEGIN GENERATED KUBERNETES WORKLOAD IDENTITY notification-service
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
    spec:
  # END GENERATED KUBERNETES WORKLOAD IDENTITY notification-service
      automountServiceAccountToken: false
      # BEGIN GENERATED KUBERNETES CONTAINER notification-service
      containers:
        - name: notification-service
          image: notification-service:replace-with-immutable-tag
          envFrom:
            - configMapRef:
                name: notification-service-config
            - secretRef:
                name: notification-service-secrets
          ports:
            - containerPort: 8081
              name: http
      # END GENERATED KUBERNETES CONTAINER notification-service
          # BEGIN GENERATED KUBERNETES PROBES notification-service
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          # END GENERATED KUBERNETES PROBES notification-service
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: 40
---
apiVersion: v1
kind: Service
# BEGIN GENERATED KUBERNETES SERVICE IDENTITY notification-service
metadata:
  name: notification-service
  namespace: rust-workspace-template
spec:
  selector:
    app.kubernetes.io/name: notification-service
# END GENERATED KUBERNETES SERVICE IDENTITY notification-service
  # BEGIN GENERATED KUBERNETES SERVICE PORT notification-service
  ports:
    - name: http
      port: 8081
      targetPort: http
  # END GENERATED KUBERNETES SERVICE PORT notification-service
