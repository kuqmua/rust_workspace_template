apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: application
  namespace: rust-workspace-template
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: application
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification-service
  namespace: rust-workspace-template
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
