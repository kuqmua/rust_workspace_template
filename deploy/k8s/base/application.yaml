apiVersion: apps/v1
kind: Deployment
# BEGIN GENERATED KUBERNETES METADATA application
metadata:
  name: application
  namespace: rust-workspace-template
# END GENERATED KUBERNETES METADATA application
spec:
  replicas: 2
  # BEGIN GENERATED KUBERNETES WORKLOAD IDENTITY application
  selector:
    matchLabels:
      app.kubernetes.io/name: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: application
    spec:
  # END GENERATED KUBERNETES WORKLOAD IDENTITY application
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: application
      # BEGIN GENERATED KUBERNETES CONTAINER application
      containers:
        - name: application
          image: application:replace-with-immutable-tag
          envFrom:
            - configMapRef:
                name: application-config
            - secretRef:
                name: application-secrets
          ports:
            - containerPort: 8080
              name: http
      # END GENERATED KUBERNETES CONTAINER application
          # BEGIN GENERATED KUBERNETES PROBES application
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          # END GENERATED KUBERNETES PROBES application
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsGroup: 10001
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: 40
---
apiVersion: v1
kind: Service
# BEGIN GENERATED KUBERNETES SERVICE IDENTITY application
metadata:
  name: application
  namespace: rust-workspace-template
  labels:
    app.kubernetes.io/name: application
spec:
  selector:
    app.kubernetes.io/name: application
# END GENERATED KUBERNETES SERVICE IDENTITY application
  # BEGIN GENERATED KUBERNETES SERVICE PORT application
  ports:
    - name: http
      port: 8080
      targetPort: http
  # END GENERATED KUBERNETES SERVICE PORT application
