apiVersion: apps/v1
kind: Deployment
metadata:
  name: application
  namespace: rust-workspace-template
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: application
    spec:
      automountServiceAccountToken: false
      containers:
        - name: application
          image: application:replace-with-immutable-tag
          envFrom:
            - configMapRef:
                name: application-config
            - secretRef:
                name: application-secrets
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: 40
---
apiVersion: v1
kind: Service
metadata:
  name: application
  namespace: rust-workspace-template
spec:
  selector:
    app.kubernetes.io/name: application
  ports:
    - name: http
      port: 8080
      targetPort: http
