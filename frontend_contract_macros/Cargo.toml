[package]
name = "frontend_contract_macros"
version = "0.1.0"
publish = false
description = "Derive macros for shared typed route contracts"
repository = "https://github.com/kuqmua/rust_workspace_template"

license = "MIT"
keywords = ["frontend", "contract"]
categories = ["web-programming"]
edition = "2024"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
str_constants = { workspace = true }
syn = { workspace = true }

[lints]
workspace = true
