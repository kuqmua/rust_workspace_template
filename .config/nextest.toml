[profile.default]
retries = 0
slow-timeout = { period = "120s" }
failure-output = "immediate"
success-output = "never"

[[profile.default.overrides]]
filter = "package(generate_pg_table_test) | package(generate_pg_types_test) | package(generate_where_filters_test) | package(tests)"
test-group = "serial-file-tests"

[test-groups.serial-file-tests]
max-threads = 1

[profile.ci]
retries = 2
slow-timeout = { period = "120s", terminate-after = 3 }
failure-output = "immediate-final"

[profile.static_workspace]
retries = 0
slow-timeout = { period = "120s" }
failure-output = "immediate"

[profile.heavy_load]
default-filter = "test(/load|concurrent|bulk/)"
test-threads = 1
retries = 0
slow-timeout = { period = "300s", terminate-after = 2 }
