[package]
name = "generate_pg_table_test"
version = "0.1.0"
publish = false
description = "Rust microservice workspace component"
repository = "https://github.com/kuqmua/rust_workspace_template"

license = "MIT"
edition = "2024"

[dev-dependencies]
str_constants = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
generate_pg_table_src = { workspace = true }
macros_helpers = { workspace = true, features = ["test-utils"] }
macro_clippy_check_common = { workspace = true, features = ["test-utils"] }
token_patterns = { workspace = true }
optml = { workspace = true }
serde = { workspace = true }
[lints]
workspace = true

[features]
test-utils = ["macro_clippy_check_common/test-utils"]
